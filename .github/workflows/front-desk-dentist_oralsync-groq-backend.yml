# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - oralsync-groq-backend

on:
  push:
    branches:
      - front-desk-dentist
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug - Show directory structure
        run: |
          echo "Current working directory:"
          pwd
          echo ""
          echo "Directory listing of root:"
          ls -la
          echo ""
          echo "Checking for adv db directory:"
          ls -la "adv db" 2>&1 || echo "Directory 'adv db' not found"
          echo ""
          echo "Checking for groq-ocr-backend at root:"
          ls -la groq-ocr-backend 2>&1 || echo "Directory 'groq-ocr-backend' not found at root"

      # Skip local venv build - let Azure Oryx handle dependencies
      # Oryx will detect requirements.txt and build the environment during deployment
      - name: Upload backend artifact for Azure deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: groq-ocr-backend/

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService
      

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: deployment/
      
      - name: Debug - List deployment contents
        run: |
          echo "Deployment directory contents:"
          ls -la deployment/
          echo "Checking for requirements.txt:"
          [ -f deployment/groq-ocr-backend/requirements.txt ] && echo "✓ Found requirements.txt" || echo "✗ requirements.txt not found"
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_56BEB34EEEA34B70BEE31BF8370DE1D3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EFA7031AC9DA41D69527F3701C5B070C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D82747A9D71349FA9518C6823EDAFC11 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'oralsync-groq-backend'
          slot-name: 'Production'
          package: deployment/groq-ocr-backend/
          