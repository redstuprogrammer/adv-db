# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - oralsync-groq-backend

on:
  push:
    branches:
      - front-desk-dentist
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug - Show directory structure
        run: |
          echo "Current working directory:"
          pwd
          echo ""
          echo "Directory listing of root:"
          ls -la
          echo ""
          echo "Checking for adv db directory:"
          ls -la "adv db" 2>&1 || echo "Directory 'adv db' not found"
          echo ""
          echo "Checking for groq-ocr-backend at root:"
          ls -la groq-ocr-backend 2>&1 || echo "Directory 'groq-ocr-backend' not found at root"

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies (subfolder)
        run: |
          python -m venv ./antenv
          ./antenv/bin/python -m pip install --upgrade pip
          ./antenv/bin/pip install --no-cache-dir -r ./groq-ocr-backend/requirements.txt
          echo "Using fixed backend requirements version: pypdfium2==4.30.0"
      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size. 
      - name: Create backend zip
        run: |
          apt-get update && apt-get install -y zip >/dev/null
          zip -r groq-ocr-backend.zip groq-ocr-backend -x "groq-ocr-backend/antenv/*"

      - name: Upload backend artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: groq-ocr-backend.zip

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService
      

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Debug artifact layout and move zip to root if present
        run: |
          echo "Working directory: $(pwd)"
          echo "Listing root:"; ls -la || true
          echo "Listing python-app dir (if exists):"; ls -la python-app || true
          if [ -f python-app/groq-ocr-backend.zip ]; then
            echo "Found python-app/groq-ocr-backend.zip, moving to root"
            mv python-app/groq-ocr-backend.zip .
          fi
          if [ -f groq-ocr-backend.zip ]; then
            echo "Final listing:"; ls -la groq-ocr-backend.zip
          else
            echo "groq-ocr-backend.zip not found after download"
            ls -la
            exit 1
          fi
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_56BEB34EEEA34B70BEE31BF8370DE1D3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EFA7031AC9DA41D69527F3701C5B070C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D82747A9D71349FA9518C6823EDAFC11 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'oralsync-groq-backend'
          slot-name: 'Production'
          package: groq-ocr-backend.zip
          